DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 16        # 减小batch size
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

OPTIM:
  NAME: 'sgd'      # 使用更稳定的SGD
  LR: 0.001        # 低学习率
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  MAX_EPOCH: 500   # 充足的训练轮数
  LR_SCHEDULER: 'multistep'
  STEPSIZE: [150, 250, 350]  # 分阶段降低学习率
  GAMMA: 0.5

TRAIN:
  PRINT_FREQ: 5

TEST:
  FINAL_MODEL: 'best_val'

MODEL:
  BACKBONE:
    NAME: 'RN101'
    CHANNEL: 512
  PROJECT:
    NUM_VIEWS: 10
  ADAPTER:
    RATIO: 0.1     # 非常小的adapter比例
    INIT: 0.3
    DROPOUT: 0.5   # 高dropout
  LIGHTWEIGHT_ADAPTER: false

SEARCH:
  TIME: 4
  RANGE: 1