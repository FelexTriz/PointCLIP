DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 16        # 减小batch size
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

OPTIM:
  NAME: 'sgd'      # 使用更稳定的SGD
  LR: 0.005        # 可以稍微提高学习率，因为只优化CoOp
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  MAX_EPOCH: 200   # 减少一些epoch
  LR_SCHEDULER: 'cosine'
  WARMUP_EPOCH: 10
  WARMUP_TYPE: 'linear'

TRAIN:
  PRINT_FREQ: 5

TEST:
  FINAL_MODEL: 'best_val'

MODEL:
  BACKBONE:
    NAME: 'RN101'
    CHANNEL: 512
  PROJECT:
    NUM_VIEWS: 10
  ADAPTER:
    RATIO: 0.5     # 调整adapter ratio
    INIT: 1.0      # 调整初始化值
    DROPOUT: 0.1   # 较低的dropout
  LIGHTWEIGHT_ADAPTER: true  # 使用轻量级adapter
  COOP_TYPE: 'multi_template'  # 添加这行来选择多模板CoOp

SEARCH:
  TIME: 6     # 增加搜索时间
  RANGE: 2    # 改为整数：1.5 -> 2
