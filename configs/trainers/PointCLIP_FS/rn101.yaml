DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 16        # 减小batch size
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

OPTIM:
  NAME: 'sgd'      # 使用更稳定的SGD
  LR: 0.002        # 适当提高学习率
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  MAX_EPOCH: 500   # 改成500轮
  LR_SCHEDULER: 'multi_step'  # 修改这里：multistep -> multi_step
  STEPSIZE: [150, 300, 400]   # 调整衰减点适应500轮
  GAMMA: 0.5

TRAIN:
  PRINT_FREQ: 5

TEST:
  FINAL_MODEL: 'best_val'

MODEL:
  BACKBONE:
    NAME: 'RN101'
    CHANNEL: 512
  PROJECT:
    NUM_VIEWS: 10
  ADAPTER:
    RATIO: 0.4     # 提高adapter ratio
    INIT: 0.8      # 提高初始化值
    DROPOUT: 0.2   # 大幅减少dropout
  LIGHTWEIGHT_ADAPTER: false

SEARCH:
  TIME: 4
  RANGE: 1