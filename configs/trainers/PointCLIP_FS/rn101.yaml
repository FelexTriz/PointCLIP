DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

OPTIM:
  NAME: 'sgd'
  LR: 0.02        # 提高学习率
  MAX_EPOCH: 300  # 增加训练轮数
  LR_SCHEDULER: 'cosine'
  WARMUP_EPOCH: 5   # 增加warm-up
  WARMUP_TYPE: 'linear'  # 改为线性warm-up
  WARMUP_CONS_LR: 1e-6

TRAIN:
  PRINT_FREQ: 5

TEST:
  FINAL_MODEL: 'best_val'

MODEL:
  BACKBONE:
    NAME: 'RN101'
    CHANNEL: 512
  PROJECT:
    NUM_VIEWS: 10
  ADAPTER:
    RATIO: 0.7      # 调整adapter比例
    INIT: 1.2       # 调整初始化值
    DROPOUT: 0.05   # 减少dropout

SEARCH:
  TIME: 4
  RANGE: 1