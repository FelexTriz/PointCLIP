DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

OPTIM:
  NAME: 'adamw'     # 尝试AdamW优化器
  LR: 0.001         # 降低学习率
  WEIGHT_DECAY: 0.05
  MAX_EPOCH: 200    # 适当减少epoch
  LR_SCHEDULER: 'cosine'
  WARMUP_EPOCH: 10  # 增加warmup
  WARMUP_TYPE: 'linear'
  WARMUP_CONS_LR: 1e-6

TRAIN:
  PRINT_FREQ: 5

TEST:
  FINAL_MODEL: 'best_val'

MODEL:
  BACKBONE:
    NAME: 'RN101'
    CHANNEL: 512
  PROJECT:
    NUM_VIEWS: 10
  ADAPTER:
    RATIO: 0.5      # 降低adapter比例，让增强特征发挥更大作用
    INIT: 0.8       # 调整初始化
    DROPOUT: 0.1    # 适当增加dropout
  LIGHTWEIGHT_ADAPTER: false  # 使用完整版本

SEARCH:
  TIME: 4
  RANGE: 1